name: Multi-Agent Branch CI

on:
  push:
    branches:
      - feature/multi-agent-architecture
  pull_request:
    branches:
      - main
    paths:
      - 'scarf/**'
      - '.github/workflows/multi-agent-ci.yml'

permissions:
  contents: read

concurrency:
  group: multi-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scarfcore-compile:
    name: ScarfCore Compile Gate
    runs-on: macos-26
    defaults:
      run:
        working-directory: scarf/Packages/ScarfCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Build ScarfCore library
        run: swift build --target ScarfCore
      - name: Build ScarfCore test target
        # Build only the ScarfCore test target. A plain `swift test` also
        # builds the unrelated scarf-projects-mcp executable/test graph,
        # which currently has upstream Swift 6.3 source errors.
        run: swift build --target ScarfCoreTests

  macos-build:
    name: macOS App Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Ensure Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1 && ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project scarf/scarf.xcodeproj
      - name: Build Scarf Debug app
        run: |
          xcodebuild \
            -project scarf/scarf.xcodeproj \
            -scheme scarf \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build
