name: Multi-Agent Branch CI

on:
  push:
    branches:
      - feature/multi-agent-architecture
  pull_request:
    branches:
      - main
    paths:
      - 'scarf/**'
      - '.github/workflows/multi-agent-ci.yml'

permissions:
  contents: read

concurrency:
  group: multi-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scarfcore-compile:
    name: ScarfCore Compile Gate
    runs-on: macos-26
    defaults:
      run:
        working-directory: scarf/Packages/ScarfCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Build ScarfCore library
        run: swift build --target ScarfCore
      - name: Build ScarfCore test target
        # Compile the complete legacy/core test target as a compatibility gate.
        run: swift build --target ScarfCoreTests

  multi-agent-tests:
    name: Multi-Agent Tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: scarf/Packages/ScarfCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Run project agent preference tests
        run: swift test --filter ProjectAgentPreferenceStoreTests

  macos-build:
    name: macOS App Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
      - name: Ensure Metal toolchain
        run: |
          if ! xcrun metal --version >/dev/null 2>&1 && ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project scarf/scarf.xcodeproj
      - name: Build Scarf Debug app
        shell: bash
        run: |
          set +e
          mkdir -p build
          xcodebuild \
            -project scarf/scarf.xcodeproj \
            -scheme scarf \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -arch arm64 \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build > build/xcodebuild.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '::group::Filtered xcodebuild diagnostics'
            grep -nE 'error:|fatal error:|SwiftCompile|CompileSwift|\*\* BUILD FAILED \*\*' build/xcodebuild.log | tail -n 240 || true
            echo '::endgroup::'
            exit "$status"
          fi
          tail -n 40 build/xcodebuild.log
      - name: Upload xcodebuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
